<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MLBB Оценщик</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap');
        :root { --bg: #0a0a10; --card: rgba(20, 20, 35, 0.8); --neon: #00d2ff; --purple: #8a2be2; --text: #fff; --sub: #8b8b9f; }
        body { background: radial-gradient(circle at top left, #1a1a2e, #0a0a10); color: var(--text); font-family: 'Montserrat', sans-serif; margin: 0; padding: 15px; min-height: 100vh; box-sizing: border-box; }
        h1 { text-align: center; font-size: 22px; background: linear-gradient(90deg, var(--neon), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; margin-bottom: 20px; }
        
        .section { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .section-title { font-size: 14px; color: var(--neon); margin-bottom: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        
        .input-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .input-group label { font-size: 13px; color: #ccc; }
        .input-group input, .input-group select { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 8px; border-radius: 8px; width: 100px; text-align: center; font-family: inherit; font-size: 14px; }
        
        /* Стили для счетчика скинов */
        .skin-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .skin-name { font-size: 12px; font-weight: 600; }
        .skin-points { font-size: 10px; color: var(--sub); }
        .counter { display: flex; align-items: center; gap: 10px; }
        .counter button { background: rgba(255,255,255,0.1); border: none; color: white; width: 28px; height: 28px; border-radius: 6px; font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .counter button:active { background: var(--purple); }
        .counter span { width: 30px; text-align: center; font-weight: bold; font-size: 14px; }

        .btn-calc { background: linear-gradient(90deg, var(--purple), var(--neon)); color: white; border: none; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 800; width: 100%; margin-top: 20px; text-transform: uppercase; box-shadow: 0 6px 20px rgba(138, 43, 226, 0.4); }
    </style>
</head>
<body>
    <h1>Калькулятор MLBB</h1>

    <div class="section">
        <div class="section-title">📊 Детали аккаунта</div>
        <div class="input-group">
            <label>Наивысший ранг</label>
            <select id="rank">
                <option value="none">Ниже Mythic</option>
                <option value="glory">Mythical Glory</option>
                <option value="immortal">Mythical Immortal</option>
            </select>
        </div>
        <div class="input-group">
            <label>Винрейт (%)</label>
            <input type="number" id="winrate" value="50" min="0" max="100">
        </div>
        <div class="input-group">
            <label>Ранговые матчи</label>
            <input type="number" id="matches" value="0" min="0">
        </div>
    </div>

    <div class="section">
        <div class="section-title">👕 Коллекция скинов</div>
        
        <div class="skin-item">
            <div><div class="skin-name">Легендарные (Supreme)</div><div class="skin-points">4000 pts</div></div>
            <div class="counter"><button onclick="updateCount('supreme', -1)">-</button><span id="supreme">0</span><button onclick="updateCount('supreme', 1)">+</button></div>
        </div>
        <div class="skin-item">
            <div><div class="skin-name">Гранд (Grand Collab)</div><div class="skin-points">3000 pts</div></div>
            <div class="counter"><button onclick="updateCount('grand', -1)">-</button><span id="grand">0</span><button onclick="updateCount('grand', 1)">+</button></div>
        </div>
        <div class="skin-item">
            <div><div class="skin-name">Изысканные (Exquisite)</div><div class="skin-points">2000 pts</div></div>
            <div class="counter"><button onclick="updateCount('exquisite', -1)">-</button><span id="exquisite">0</span><button onclick="updateCount('exquisite', 1)">+</button></div>
        </div>
        <div class="skin-item">
            <div><div class="skin-name">Роскошные (Deluxe)</div><div class="skin-points">400 pts</div></div>
            <div class="counter"><button onclick="updateCount('deluxe', -1)">-</button><span id="deluxe">0</span><button onclick="updateCount('deluxe', 1)">+</button></div>
        </div>
        <div class="skin-item">
            <div><div class="skin-name">Исключительные (Special)</div><div class="skin-points">200 pts</div></div>
            <div class="counter"><button onclick="updateCount('exceptional', -1)">-</button><span id="exceptional">0</span><button onclick="updateCount('exceptional', 1)">+</button></div>
        </div>
        <div class="skin-item">
            <div><div class="skin-name">Обычные (Common)</div><div class="skin-points">100 pts</div></div>
            <div class="counter"><button onclick="updateCount('common', -1)">-</button><span id="common">0</span><button onclick="updateCount('common', 1)">+</button></div>
        </div>
    </div>

    <button class="btn-calc" onclick="calculate()">Рассчитать стоимость</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        let counts = { supreme: 0, grand: 0, exquisite: 0, deluxe: 0, exceptional: 0, common: 0 };

        function updateCount(type, change) {
            counts[type] = Math.max(0, counts[type] + change);
            document.getElementById(type).innerText = counts[type];
        }

        function calculate() {
            const data = {
                rank: document.getElementById('rank').value,
                winrate: parseInt(document.getElementById('winrate').value) || 0,
                matches: parseInt(document.getElementById('matches').value) || 0,
                skins: counts
            };
            tg.sendData(JSON.stringify({ action: "calculate_manual", data: data }));
            tg.close();
        }
    </script>
</body>
</html>
